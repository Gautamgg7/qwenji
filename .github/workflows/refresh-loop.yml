name: qwen-refresh-loop

# Overlapping keepalive chain: a new loop starts every 5h and cancels the
# previous one, so exactly one loop is always refreshing tokens every 10 min.
on:
  schedule:
    - cron: "7 */5 * * *"
  workflow_dispatch:

concurrency:
  group: qwen-refresh-loop
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # ~5.5h > 5h schedule gap = overlap, no break
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: refresh loop
        run: node scripts/refresh-loop.mjs
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
